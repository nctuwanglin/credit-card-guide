name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DASHBOARD_FILE: index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm test
        env:
          TZ: America/New_York
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
