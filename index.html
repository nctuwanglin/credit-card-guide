<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 信用卡回饋指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf3f8;
    --surface:#ffffff;
    --ink:#16324f;
    --muted:#51677b;
    --faint:#51677b;
    --line:#cddce7;
    --gain:#087568;
    --gain-soft:#e0f3ef;
    --amber:#805600;
    --amber-soft:#f7eed7;
    --shadow:0 1px 2px rgba(22,50,79,.06),0 8px 24px -16px rgba(22,50,79,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  /* ---------- HERO (minimal) ---------- */
  header.hero{
    padding:28px 0 18px;
    border-bottom:4px solid #20b6a4;
    background:#16324f;
    color:#fff;
  }
  header.hero .yr{color:#fff}
  header.hero .yr .dot{color:#61dbc9}
  header.hero .asof,header.hero .asof b{color:#d1e3ee}
  .title-row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .yr{
    font-family:"Space Grotesk",sans-serif;font-weight:700;
    font-size:clamp(56px,16vw,104px);line-height:.82;
    letter-spacing:-.03em;color:var(--ink);
  }
  .yr .dot{color:var(--gain)}
  h1{
    font-family:"Noto Sans TC",sans-serif;font-weight:900;
    font-size:clamp(22px,5.4vw,34px);letter-spacing:.01em;
    padding-bottom:8px;
  }

  /* ---------- TYPE TABS ---------- */
  .tabs{
    display:flex;gap:8px;margin-top:18px;
  }
  .tab{
    cursor:pointer;user-select:none;
    font-size:14px;font-weight:700;
    padding:10px 22px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);
    color:var(--muted);transition:.15s;
  }
  .tab:hover{border-color:var(--ink);color:var(--ink)}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- CARD MULTI-SELECTOR ---------- */
  .selector{
    background:var(--surface);
    border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:18px 0 6px;
    box-shadow:var(--shadow);
  }
  .sel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:11px;flex-wrap:wrap;gap:8px;
  }
  .sel-title{
    font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.2em;text-transform:uppercase;
    font-family:"JetBrains Mono",monospace;
  }
  .sel-actions{display:flex;gap:6px}
  .sel-btn{
    cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted);
    background:transparent;border:1px solid var(--line);
    padding:4px 10px;border-radius:6px;transition:.15s;
  }
  .sel-btn:hover{border-color:var(--ink);color:var(--ink)}
  .sel-grid{display:flex;flex-wrap:wrap;gap:6px}
  .sel-pill{
    cursor:pointer;user-select:none;
    font-size:12.5px;font-weight:500;
    padding:6px 11px;border-radius:8px;
    border:1px solid var(--line);background:#f6f7fa;
    color:var(--muted);transition:.12s;
    display:inline-flex;align-items:center;gap:5px;
  }
  .sel-pill .dot{
    width:8px;height:8px;border-radius:50%;background:#d0d3dc;flex:0 0 auto;
  }
  .sel-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sel-pill.on .dot{background:#7ce0a8}

  /* ---------- SCENARIO FILTER ---------- */
  .filter{
    position:sticky;top:0;z-index:20;
    background:rgba(231,233,238,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:12px 0;margin-top:10px;
  }
  .filter-inner{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px;scrollbar-width:none}
  .filter-inner::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;cursor:pointer;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;
    white-space:nowrap;transition:.18s;user-select:none;
  }
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.active{background:var(--gain);color:#fff;border-color:var(--gain)}

  /* ---------- RECOMMENDATION ---------- */
  .reco{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
  .reco-label{
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;
    color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  }
  .reco-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;color:var(--ink);
    background:var(--gain-soft);border:1px solid #cfe9db;
    padding:4px 11px;border-radius:999px;
  }
  .reco-pill b{color:var(--gain);font-family:"JetBrains Mono",monospace;font-size:13px;margin-left:2px}
  .reco-medal{color:var(--gain);font-weight:700}
  .reco-meta{font-size:10px;font-weight:600;color:var(--amber);background:#f7eed7;border-radius:4px;padding:0 5px;margin-left:2px}
  .reco-more{cursor:pointer;background:#f6f7fa;border:1px dashed var(--line);color:var(--muted);user-select:none}
  .reco-more:hover{border-color:var(--ink);color:var(--ink)}

  /* ---------- DATA AS OF ---------- */
  .asof{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--faint);margin-top:10px;text-transform:uppercase}
  .asof b{color:var(--gain);font-weight:700}

  /* ---------- EXPIRY BADGE ---------- */
  .expire{display:inline-block;margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:5px;padding:1px 7px;color:#fff;background:#d64533;font-family:"Noto Sans TC",sans-serif}
  .expire.ended{background:#596173}

  /* ---------- RECO CAP HINT ---------- */
  .reco-cap{font-size:10px;color:var(--faint);margin-left:3px;font-family:"JetBrains Mono",monospace}

  /* ---------- SELECTOR COLLAPSE (mobile) ---------- */
  .sel-toggle{display:none;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);padding:4px 10px;border-radius:6px}
  @media(max-width:680px){
    .sel-toggle{display:inline-block}
    .selector.collapsed .sel-grid{display:none}
    .selector.collapsed .sel-actions .sel-btn{display:none}
  }

  /* ---------- CHIP SCROLL FADE ---------- */
  .chip-scroll{position:relative}
  .chip-scroll::after{content:"";position:absolute;top:0;right:0;width:44px;height:100%;background:linear-gradient(90deg,rgba(231,233,238,0),rgba(231,233,238,.95));pointer-events:none}

  /* ---------- MILE STRIP ---------- */
  .hide{display:none!important}
  .milestrip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:13px;display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow)}
  .milestrip .ms-label{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.15em;color:var(--muted);width:100%;text-transform:uppercase}

  /* ---------- GRID ---------- */
  .grid{
    display:grid;gap:16px;padding:26px 0 0;
    grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));
  }
  @media(max-width:560px){.grid{grid-template-columns:1fr;gap:14px}}

  .card{
    position:relative;background:var(--surface);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;
    border:1px solid var(--line);
    transition:opacity .25s, transform .25s, box-shadow .25s;
    display:flex;flex-direction:column;
  }
  .card .rail{height:5px;width:100%}
  .card-body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:11px;flex:1}

  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    background:#f1f2f6;color:var(--muted);
    padding:3px 8px;border-radius:6px;text-transform:uppercase;
    font-family:"JetBrains Mono",monospace;
  }
  .tag.jp{background:#fbe9e9;color:#b5322f}
  .tag.kr{background:#ece4f7;color:#6534a5}
  .tag.eu{background:#dfeaf7;color:#1e5fa3}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name-block{min-width:0;flex:1 1 auto}
  .name-block .name{font-weight:900;font-size:19px;letter-spacing:.01em;line-height:1.25}
  .name-block .issuer{font-size:12px;color:var(--faint);margin-top:2px}
  .valid{
    flex:0 0 auto;max-width:44%;text-align:right;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;
    color:var(--muted);line-height:1.4;
  }
  .valid span{display:block;color:var(--faint);font-size:9px;letter-spacing:.1em}

  .pts{
    display:inline-flex;align-self:flex-start;align-items:center;gap:5px;
    font-size:11px;color:var(--muted);
    background:#f6f7fa;border:1px solid var(--line);
    padding:3px 9px;border-radius:7px;
  }
  .pts b{color:var(--ink);font-weight:700}

  /* scheme block for multi-scheme cards */
  .scheme{
    border-left:3px solid var(--line);padding:2px 0 2px 11px;
  }
  .scheme.hi{border-left-color:var(--gain)}
  .scheme-name{
    font-size:11px;font-weight:700;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;
    font-family:"JetBrains Mono",monospace;
  }
  .scheme.hi .scheme-name{color:var(--gain)}

  /* tier ladder */
  .tiers{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .tier{display:flex;gap:12px;align-items:baseline}
  .rate{
    flex:0 0 64px;text-align:right;
    font-family:"JetBrains Mono",monospace;font-weight:700;
    font-size:20px;letter-spacing:-.02em;color:var(--ink);
    line-height:1;
  }
  .rate.hi{color:var(--gain)}
  .rate small{font-size:11px;font-weight:500;color:var(--faint)}
  .tier-info{flex:1;min-width:0}
  .tier-label{font-size:13px;font-weight:500;color:var(--ink);line-height:1.4}
  .tier-sub{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4}
  .cap{
    display:inline-block;margin-top:3px;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;
    background:var(--gain-soft);color:var(--gain);
    padding:2px 7px;border-radius:5px;font-weight:700;
  }
  .cap.none{background:#eef0f4;color:var(--muted)}

  .note{
    font-size:12px;color:var(--muted);line-height:1.5;
    border-top:1px dashed var(--line);padding-top:10px;
  }
  .alert{
    display:flex;gap:8px;font-size:12px;line-height:1.5;
    background:var(--amber-soft);color:#6b4a02;
    border-radius:9px;padding:9px 11px;
  }
  .alert b{color:var(--amber)}
  .alert .ic{flex:0 0 auto;font-weight:700}

  .footer-link{
    margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
    border-top:1px solid var(--line);padding-top:10px;
  }
  .official{
    font-size:11.5px;font-weight:600;color:var(--gain);
    text-decoration:none;display:inline-flex;align-items:center;gap:5px;
    transition:.15s;
  }
  .official:hover{color:#085a37;text-decoration:underline}
  .official .arrow{font-size:13px;transition:transform .15s}
  .official:hover .arrow{transform:translateX(2px)}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:14px}

  /* ---------- VISITOR COUNTER ---------- */
  .visits{
    display:flex;justify-content:center;gap:18px;
    margin-top:34px;padding-top:18px;
    border-top:1px solid var(--line);
    font-family:"JetBrains Mono",monospace;font-size:11.5px;
    color:var(--faint);
  }
  .visits b{color:var(--muted);font-weight:700}
  button{font-family:inherit}
  :focus-visible{outline:3px solid #1763c9;outline-offset:3px}
  .skip-link{position:absolute;left:16px;top:-80px;background:white;padding:12px;z-index:100}
  .skip-link:focus{top:8px}
  .card{scroll-margin-top:90px}
  .grid{align-items:start}
  /* 摘要＋展開：卡面預設只列重點優惠，其餘收進原生 details */
  .ctiers{display:flex;flex-direction:column;gap:10px}
  .merchant-search{margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--paper,#fff)}
  .merchant-search h2{margin:0 0 10px;font-size:17px}
  .merchant-search{border-top:3px solid var(--gain)}
  .merchant-item{background:#f5fafc}
  .merchant-item:first-child{border-left:4px solid var(--gain);background:var(--gain-soft)}
  .merchant-fields{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .merchant-fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;flex:1;min-width:150px}
  .merchant-fields input,.merchant-fields select,.merchant-search button{min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px;font:inherit;max-width:100%}
  .merchant-hint,.merchant-status{font-size:12px;line-height:1.7;color:var(--muted)}
  .merchant-list{padding:0;list-style:none;display:grid;gap:12px}
  .merchant-item{padding:12px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere;font-size:13px;line-height:1.7}
  .merchant-item h3{font-size:15px;margin:0 0 6px}
  .merchant-item strong{color:var(--gain)}
  .merchant-item a{display:inline-flex;align-items:center;min-height:44px}
  .merchant-item summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .ctier{display:flex;gap:12px;align-items:baseline}
  .ctier-info{flex:1;min-width:0}
  .ctier-label{font-size:13px;font-weight:500;color:var(--ink);line-height:1.4}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .chips span{font-size:10.5px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:5px;background:#eef0f4;color:#3f4658;overflow-wrap:anywhere}
  .chips .c-cap{background:var(--gain-soft);color:var(--gain);font-family:"JetBrains Mono",monospace}
  .chips .c-lim,.chips .c-warn{background:var(--amber-soft);color:#6b4a02}
  .chips .c-cond{background:#e6eefb;color:#1b4f93}
  details.more{border-top:1px dashed var(--line)}
  details.more>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--gain);list-style:none}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::after{content:"▾";font-size:11px}
  details.more[open]>summary::after{content:"▴"}
  details.more>.more-body{display:flex;flex-direction:column;gap:11px;padding:2px 0 8px}
  .tag.more-tag{background:transparent;border:1px dashed var(--line)}
  .ctier.stale .rate{color:#5b6070}
  .ctier.stale .ctier-label{text-decoration:line-through;text-decoration-color:#9aa1b1}
  .tier.relevant{background:var(--gain-soft);border-radius:8px;padding:8px 4px;border-left:3px solid var(--gain)}
  .tier.inactive{background:#f6f7fa;border-radius:6px}
  .tier-meta{font-size:10.5px;color:var(--muted);margin-top:4px}
  .tier-meta a{color:var(--gain)}
  .verification-warning{color:var(--amber)}
  .audit{margin-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .audit summary{cursor:pointer;padding:12px 0;min-height:44px;line-height:20px;font-weight:600;color:var(--muted)}
  .audit[open] summary{color:var(--ink)}
  .audit-records{list-style:none;padding:0;margin:0}
  .audit-records li{padding:7px 0;border-top:1px solid var(--line);line-height:1.7;overflow-wrap:anywhere}
  .audit-records b,.audit-records span{display:block}
  .audit-records b{font-weight:500;color:var(--ink)}
  .audit-sources{padding-left:20px;line-height:2;margin:8px 0}
  .audit-sources a{color:var(--gain);overflow-wrap:anywhere;display:inline-block;min-height:44px;padding:10px 0}
  .tier-meta a,.official{min-height:44px;display:inline-flex;align-items:center}
  .card-body,.pts,.cap,.note,.alert,.tier-sub{overflow-wrap:anywhere;min-width:0}
  a.reco-pill{text-decoration:none;flex-wrap:wrap;max-width:100%}
  .offer-controls{display:flex;gap:16px;flex-wrap:wrap;padding-top:12px;font-size:12px;color:var(--muted)}
  .offer-controls label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
  .offer-controls input{width:17px;height:17px;accent-color:var(--gain)}
  .result-status{font-size:12px;color:var(--muted);margin-top:14px}
  @media(max-width:680px){.sel-pill,.chip,.sel-btn,.sel-toggle{min-height:44px}.reco-pill{border-radius:12px}.head{flex-wrap:wrap}.valid{overflow-wrap:anywhere}.card-body{padding:16px 14px}.rate{flex-basis:68px;font-size:18px}.pts{max-width:100%;flex-wrap:wrap}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip-link" href="#mainContent">跳至信用卡內容</a>

<header class="hero">
  <div class="wrap">
    <div class="title-row">
      <div class="yr">20<span class="dot">2</span>6</div>
      <h1>信用卡回饋指南</h1>
    </div>
    <div class="asof">10月優惠更新 <b>2026/10/01</b> · 各優惠適用條件與期限不同，待確認項目保留提醒</div>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="group" aria-label="回饋類型">
    <button type="button" class="tab active" id="tabCash" aria-pressed="true" onclick="switchTab('cash')">💰 現金回饋</button>
    <button type="button" class="tab" id="tabMile" aria-pressed="false" onclick="switchTab('mile')">✈️ 哩程回饋</button>
  </div>
  <div class="selector">
    <div class="sel-head">
      <div class="sel-title">選擇要顯示的卡片</div>
      <div class="sel-actions">
        <button class="sel-btn" onclick="selectAll(true)">全選</button>
        <button class="sel-btn" onclick="selectAll(false)">全部取消</button>
        <button class="sel-toggle" id="selToggle" aria-controls="selGrid" onclick="toggleSelector()"></button>
      </div>
    </div>
    <div class="sel-grid" id="selGrid"></div>
  </div>
</div>

<div class="filter">
  <div class="wrap">
    <div class="chip-scroll"><div class="filter-inner" id="chips" role="group" aria-label="消費情境"></div></div>
  </div>
</div>
<div class="wrap">
  <div class="offer-controls" aria-label="優惠顯示設定">
    <label><input type="checkbox" checked onchange="showLimited=this.checked;refreshOffers()">包含限時優惠</label>
    <label><input type="checkbox" checked onchange="excludeNew=this.checked;refreshOffers()">排除新戶／新卡專屬</label>
  </div>
</div>
<div class="wrap" id="cashTools">
  <div class="reco" id="reco"></div>
</div>
<div class="wrap" id="searchTools">
  <section class="merchant-search" aria-labelledby="merchantHeading">
    <h2 id="merchantHeading">商家搜尋・該刷哪張？</h2>
    <div class="merchant-fields">
      <label for="merchantQuery">商家或消費項目
        <input id="merchantQuery" type="search" placeholder="例如：Agoda、淘寶、國內一般消費" maxlength="80" aria-describedby="merchantHint" oninput="setMerchantQuery(this.value)" oncompositionend="setMerchantQuery(this.value)" onchange="setMerchantQuery(this.value)" onsearch="setMerchantQuery(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();setMerchantQuery(this.value)}">
      </label>
      <button type="button" onclick="clearMerchantSearch()">清除搜尋</button>
    </div>
    <p class="merchant-hint" id="merchantHint">只列已確認適用且已勾選的卡片；須符合方案條件。未扣手續費與已用額度；分期不適用本搜尋。</p>
    <div id="merchantChannels" class="merchant-fields" role="group" aria-label="交易方式"></div>
    <p class="merchant-status" id="merchantStatus" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="merchantResults"></div>
  </section>
</div>
<div class="wrap"><div class="milestrip hide" id="mileStrip"></div></div>

const bankOf = c => c.name.split(' ')[0];
const BANK_IDX = {};
cards.forEach(c=>{const b=bankOf(c);if(!(b in BANK_IDX))BANK_IDX[b]=Object.keys(BANK_IDX).length;});
let visibleCards = new Set(cards.map(c=>c.id));
// 選卡狀態記憶（localStorage）
const LS_KEY='ccg-visible';
try{
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(Array.isArray(saved)){
    const ids=new Set(cards.map(c=>c.id));
    const v=saved.filter(id=>ids.has(id));
    visibleCards=new Set(v);
  }else if(saved?.version===2 && Array.isArray(saved.selected) && Array.isArray(saved.known)){
    const known=new Set(saved.known),selected=new Set(saved.selected);
    visibleCards=new Set(cards.filter(c=>!known.has(c.id)||selected.has(c.id)).map(c=>c.id));
  }
}catch(e){}
function saveVisible(){try{localStorage.setItem(LS_KEY,JSON.stringify({version:2,known:cards.map(c=>c.id),selected:[...visibleCards]}))}catch(e){}}
saveVisible();

function switchTab(tab){
  if(tab===activeTab) return;
  activeTab = tab;
  activeScenario = "全部";
  recoExpanded = false;
  document.getElementById('tabCash').classList.toggle('active', tab==='cash');
  document.getElementById('tabMile').classList.toggle('active', tab==='mile');
  document.getElementById('tabCash').setAttribute('aria-pressed',String(tab==='cash'));
  document.getElementById('tabMile').setAttribute('aria-pressed',String(tab==='mile'));
  document.getElementById('cashTools').style.display=tab==='mile'?'none':'';
  document.querySelector('.filter').style.display = tab==='mile' ? 'none' : '';
  document.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('active', x.textContent==='全部');x.setAttribute('aria-pressed',String(x.textContent==='全部'));});

const selGrid = document.getElementById('selGrid');
const chipBox = document.getElementById('chips');
const grid = document.getElementById('grid');

function renderSelector(){
  selGrid.innerHTML = "";
  tabCards().forEach(c=>{
    const pill = document.createElement('button');
    pill.type='button';
    pill.setAttribute('aria-pressed',String(visibleCards.has(c.id)));
    pill.className = "sel-pill"+(visibleCards.has(c.id)?" on":"");
    pill.innerHTML = `<span class="dot"></span>${c.name}`;
    pill.onclick = ()=>{
      if(visibleCards.has(c.id)) visibleCards.delete(c.id);
      else visibleCards.add(c.id);
      saveVisible();
      pill.classList.toggle('on',visibleCards.has(c.id));
      pill.setAttribute('aria-pressed',String(visibleCards.has(c.id)));
      updateSelectorUI();
      renderReco();
      renderGrid();
      renderMileStrip();
    };
    selGrid.appendChild(pill);
  });
  updateSelectorUI();
}

function selectAll(state){
  tabCards().forEach(c=>{
    if(state) visibleCards.add(c.id);
    else visibleCards.delete(c.id);
  });
  saveVisible();
  renderSelector();
  renderReco();
  renderGrid();
  renderMileStrip();
}

function rateSuffix(r){
  return /^\+?[0-9.]+$/.test(r) ? '%' : '';
}

// 到期角標：30天內到期→紅標「即將到期」；已過期→灰標「已到期」
function expBadge(c){
  const end=c.end;if(!end)return'';
  const days=Math.ceil((Date.parse(end+'T00:00:00+08:00')+86400000-Date.now())/86400000);
  if(expired(end))return`<span class="expire ended">已到期 請確認新方案</span>`;
  if(days<=30)return`<span class="expire">⏳ 即將到期 ${end.slice(5).replace('-','/')}止</span>`;
  return'';
}

function renderAudit(c){
  const sources=new Map();
  const reference=(url)=>{
    if(!url)return '來源待補';
    if(url===c.url)return '信用卡官網';
    if(!sources.has(url))sources.set(url,sources.size+1);
    return '來源 '+sources.get(url);
  };
  const offers=c.schemes?c.schemes.flatMap(s=>s.tiers.map(t=>({...t,label:s.name+'／'+t.label,source:t.source||s.source}))):c.tiers||[];
  const records=offers.map(t=>`<li><b>${t.label}</b><span>${t.checkedAt?'核對 '+t.checkedAt:'尚待查證'}${t.verifiedFields?'；'+t.verifiedFields:''}；${reference(t.source||c.url)}${t.capSource?'；上限依據：'+reference(t.capSource):''}</span></li>`);
  records.push(`<li><b>年費</b><span>${c.feeCheckedAt?'核對 '+c.feeCheckedAt:'尚待重新核實'}；${reference(c.feeSource)}</span></li>`);
  if(c.pointSources?.length)records.push(`<li><b>點數使用</b><span>${c.pointsCheckedAt?'核對 '+c.pointsCheckedAt+'；':''}${c.pointSources.map(reference).join('、')}</span></li>`);
  return `<details class="audit"><summary>資料來源與查證紀錄</summary><ul class="audit-records">${records.join('')}</ul>${sources.size?`<ul class="audit-sources">${[...sources].map(([url,n])=>`<li><a href="${url}" target="_blank" rel="noopener">來源 ${n}：官方條款</a></li>`).join('')}</ul>`:''}</details>`;
}

// ---------- 摘要＋展開 ----------
const PERIOD_LABEL={month:'日曆月',postingMonth:'入帳月',reportingMonth:'回報月',paymentMonth:'繳款月',statement:'每期帳單',quarter:'日曆季',campaign:'活動期間',year:'曆年',benefitYear:'權益年度'};
const NUM_RATE=/^[0-9]+(?:\.[0-9]+)?(?:元\/哩)?$/;
const SUMMARY_MAX=4,TAG_MAX=5;
// 把 schemes/tiers 攤平成 [{t,s}]，並把方案層的 source/end 下放到每層（與 renderTier 既有邏輯一致）
function cardOffers(c){
  if(c.schemes)return c.schemes.flatMap((s,si)=>s.tiers.map((t,ti)=>({key:`${c.id}:scheme:${si}:${ti}`,t:{...t,source:t.source||s.source||c.url,end:t.end||s.end},s:s.name})));
  return (c.tiers||[]).map((t,ti)=>({key:`${c.id}:tier:${ti}`,t:{...t,source:t.source||c.url},s:null}));
}
// 挑摘要層：只挑「目前有效、可比較的數字回饋」。選了情境→該情境相關層（含限時）優先；
// 「全部」→一般方案依 hi／回饋高低，方案卡每個方案只取一層。t.highlight===true 可手動釘選。
function pickHighlights(c,scn,live){
  const mile=isMileCard(c);
  const val=o=>o.t.scenarioRates?.[scn] ?? parseFloat(o.t.rate);
  const better=(a,b)=>mile?val(a)-val(b):val(b)-val(a);
  const ok=live.filter(o=>offerActive(o.t)&&!o.t.suspendRanking);
  const picks=[];
  const add=o=>{if(picks.length<SUMMARY_MAX&&!picks.includes(o)&&!picks.some(p=>p.t.label===o.t.label))picks.push(o);};
  ok.filter(o=>o.t.highlight&&(scn==='全部'||o.t.scenarios?.includes(scn))).forEach(add);
  if(scn!=='全部')ok.filter(o=>NUM_RATE.test(o.t.rate)&&o.t.scenarios?.includes(scn)).sort(better).forEach(add);
  // 選了情境就只列該情境的層，避免拿其他通路的高回饋「補滿」造成誤導；完全沒有相關層才退回一般層
  if(scn==='全部'||picks.length===0){
    const seen=new Set(picks.map(o=>o.s).filter(Boolean));
    ok.filter(o=>NUM_RATE.test(o.t.rate)&&o.t.kind!=='limited'&&!picks.includes(o))
      .sort((a,b)=>(!!b.t.hi-!!a.t.hi)||better(a,b))
      .forEach(o=>{if(o.s&&seen.has(o.s))return;if(o.s)seen.add(o.s);add(o);});
  }
  return picks.sort(better);
}
// 長句只留首個子句；完整條件必須同時出現在可點擊／鍵盤展開的詳細區。
function shortText(str,n){
  const first=String(str).split(/[；;，（(。]/)[0].trim()||String(str);
  const cut=first.length>n?first.slice(0,n)+'…':first;
  return {text:cut,truncated:cut!==String(str)};
}
function chipSpan(cls,str,n){
  const {text,truncated}=shortText(str,n);
  return `<span class="${cls}"${truncated?` title="${String(str).replace(/"/g,'&quot;')}"`:''}>${text}</span>`;
}
function capChip(t){
  if(t.capSpend!=null)return `可刷約${t.capSpend.toLocaleString()}${PERIOD_LABEL[t.capPeriod]?'／'+PERIOD_LABEL[t.capPeriod]:''}`;
  return t.cap||'上限待確認';
}
function displayRate(t){
  return String(t.scenarioRates?.[activeScenario] ?? t.rate);
}
function renderCompactTier(t,stale,scheme,cardUrl,key){
  const unverified=!t.checkedAt||/待確認|待核實|待驗證|待查證|未確認|未核實|未驗證|未查證/.test(t.verifiedFields||'');
  const chips=[
    stale?`<span class="c-warn">條款期間已至${t.end}，續行待確認</span>`:'',
    !stale&&t.kind==='limited'?`<span class="c-lim">限時${t.end?'至'+t.end.slice(5).replace('-','/'):''}</span>`:'',
    t.audience==='new'?'<span class="c-lim">新戶專屬</span>':'',
    t.condition?chipSpan('c-cond',t.condition,12):'',
    `<span class="${t.cap==='無上限'?'':'c-cap'}">${t.cap||'上限待確認'}</span>`,
    t.capSpend!=null?chipSpan('c-cap',capChip(t),40):'',
    unverified?'<span class="c-warn">待確認</span>':''
  ].join('');
  const rate=displayRate(t);
  return `<div class="ctier${stale?' stale':''}"><div class="rate ${t.hi&&!stale?'hi':''}">${rate}<small>${rateSuffix(rate)}</small></div><div class="ctier-info">${scheme?`<div class="scheme-name">${scheme}</div>`:''}<div class="ctier-label">${t.label}</div><div class="chips">${chips}</div><details class="more offer-details"${key?` data-detail-key="${key}"`:''}><summary>完整條件與上限<span class="sr-only">：${scheme||''} ${t.label}</span></summary>${renderTier(t,undefined,cardUrl,true)}</details></div></div>`;
}
function renderOfferList(c,list){
  if(!c.schemes)return `<div class="tiers">${list.map(o=>renderTier(o.t,undefined,c.url)).join('')}</div>`;
  const groups=[];
  list.forEach(o=>{let g=groups.find(x=>x.s===o.s);if(!g){g={s:o.s,items:[]};groups.push(g);}g.items.push(o);});
  return groups.map(g=>`<div class="scheme ${c.schemes.find(s=>s.name===g.s)?.hi?'hi':''}"><div class="scheme-name">${g.s}</div><div class="tiers">${g.items.map(o=>renderTier(o.t,undefined,c.url)).join('')}</div></div>`).join('');
}
function renderCardBody(c){
  // 過期的層不再佔卡面（推薦本來就已排除）；限時／新戶篩選沿用 offerAllowed
  const allowed=cardOffers(c).filter(o=>offerAllowed(o.t));
  const live=allowed.filter(o=>!expired(o.t.end));
  // 條款期間已過、但官方仍展示且續行未確認的層：不能藏起來（否則使用者看不到「這項可能已不存在」）
  const stale=allowed.filter(o=>expired(o.t.end)&&/待確認|續行/.test(o.t.label+(o.t.verifiedFields||'')));
  const picks=pickHighlights(c,activeScenario,live);
  const rest=live.filter(o=>!picks.includes(o));
  const limited=rest.filter(o=>o.t.kind==='limited'),regular=rest.filter(o=>o.t.kind!=='limited');
  const rows=picks.map(o=>renderCompactTier(o.t,false,o.s,c.url,o.key));
  let html=rows.length?`<div class="ctiers">${rows.join('')}</div>`:'';
  if(limited.length)html+=`<details class="more" data-detail-key="${c.id}:limited"><summary>🎁 限時／活動優惠 ${limited.length} 項</summary><div class="more-body">${renderOfferList(c,limited)}</div></details>`;
  const noteHtml=c.note?`<div class="note">${c.note}</div>`:'';
  if(regular.length)html+=`<details class="more" data-detail-key="${c.id}:regular"><summary>更多優惠 ${regular.length} 項${c.note?'與說明':''}</summary><div class="more-body">${renderOfferList(c,regular)}${noteHtml}</div></details>`;
  else html+=noteHtml;
  if(stale.length)html+=`<details class="more" data-detail-key="${c.id}:stale"><summary>過期待確認 ${stale.length} 項</summary><div class="more-body">${stale.map(o=>renderCompactTier(o.t,true,o.s,c.url,o.key)).join('')}</div></details>`;
  return html;
}

function renderTier(t,defaultEnd,cardUrl,detailsOnly=false){
  const end=t.end || defaultEnd;
  const ended=expired(end);
  return `
    <div class="tier${activeScenario!=='全部'&&t.scenarios?.includes(activeScenario)?' relevant':''}${ended?' inactive':''}">
      ${detailsOnly?'':`<div class="rate ${offerActive({...t,end})&&t.hi?'hi':''}">${displayRate(t)}<small>${rateSuffix(displayRate(t))}</small></div>`}
      <div class="tier-info">
        ${detailsOnly?'':`<div class="tier-label">${t.label}</div>`}
        <div class="tier-meta">${t.kind==='limited'?'限時優惠':'一般方案'}${t.audience==='new'?' · 新戶／新卡專屬':''} · ${end?`${ended?'已到期／待確認新方案 · ':t.start&&Date.now()<Date.parse(t.start+'T00:00:00+08:00')?'尚未開始 · ':''}${t.start?t.start+'～':'優惠至 '}${end}`:'日期待確認'}</div>
        ${t.sub?`<div class="tier-sub">${t.sub}</div>`:''}
        ${t.condition?`<div class="tier-sub">${t.condition}</div>`:''}
        <span class="cap ${t.cap==='無上限'?'none':''}">${t.cap||'上限待確認'}</span>
        ${!t.checkedAt||/待確認|待核實|待驗證|待查證|未確認|未核實|未驗證|未查證/.test(t.verifiedFields||'')?`<div class="tier-meta verification-warning">${t.checkedAt?t.verifiedFields:'待查證'}</div>`:''}
        ${t.source&&t.source!==cardUrl?`<div class="tier-meta"><a href="${t.source}" target="_blank" rel="noopener">活動詳情</a></div>`:''}
      </div>
    </div>`;
}

// 僅保留本次瀏覽的展開狀態；以原始優惠位置識別，不受排序與摘要位置改變影響。
const detailStates=new Map();
function renderGrid(){
  document.querySelectorAll('#grid details[data-detail-key]').forEach(d=>detailStates.set(d.dataset.detailKey,d.open));
  grid.innerHTML = "";
  let shown = 0;
  let list = tabCards().filter(c=>visibleCards.has(c.id) && (activeScenario==="全部" || c.tags.includes(activeScenario)));
  if(activeScenario!=="全部"){
    const rateOf = c => bestOffer(c,activeScenario)?.value ?? -1;
    list.sort((a,b)=> rateOf(b)-rateOf(a) || compareCards(a,b,activeScenario));
  }else{
    list.sort((a,b)=> BANK_IDX[bankOf(a)]-BANK_IDX[bankOf(b)]);
  }
  list.forEach(c=>{
    shown++;
    const el = document.createElement('article');
    el.className = "card";
    el.id='card-'+c.id;
    el.setAttribute('aria-labelledby','heading-'+c.id);
    el.tabIndex=-1;
    const sortedTags=[...c.tags].sort((a,b)=>(b===activeScenario)-(a===activeScenario));
    const tagsHtml = sortedTags.slice(0,TAG_MAX).map(t=>{
      let cls = "tag";
      if(t==="旅日") cls += " jp";
      else if(t==="旅韓") cls += " kr";
      else if(t==="旅歐美") cls += " eu";
      return `<span class="${cls}">${t}</span>`;
    }).join("")+(sortedTags.length>TAG_MAX?`<span class="tag more-tag" title="${sortedTags.slice(TAG_MAX).join('、')}">+${sortedTags.length-TAG_MAX}</span>`:'');

    const body = renderCardBody(c);

    el.innerHTML = `
      <div class="rail" style="background:${c.rail}"></div>
      <div class="card-body">
        <div class="tags">${tagsHtml}</div>
        <div class="head">
          <div class="name-block">
            <h2 class="name" id="heading-${c.id}">${c.name}</h2>
            <div class="issuer">${c.issuer}</div>
          </div>
          <div class="valid"><span>適用期間</span>${c.valid}${expBadge(c)?'<br>'+expBadge(c):''}</div>
        </div>
        <span class="pts">點數 · <b>${c.pts}</b></span>
        <span class="pts">年費 · <b>${c.fee||'待查證（不代表免年費）'}</b>${!c.feeCheckedAt&&c.fee?' · 尚待重新核實':''}</span>
        ${body}
        ${c.alert?`<div class="alert"><span class="ic">⚠</span><span><b>留意：</b>${c.alert}</span></div>`:''}
        <div class="footer-link">
          <a class="official" href="${c.url}" target="_blank" rel="noopener">信用卡官網 <span class="arrow">→</span></a>
        </div>
      </div>`;
    grid.appendChild(el);
  });
  if(shown===0) grid.innerHTML = `<div class="empty">此組合下無對應卡片，請調整篩選</div>`;
  document.querySelectorAll('#grid details[data-detail-key]').forEach(d=>{d.open=detailStates.get(d.dataset.detailKey)===true;});
  document.getElementById('resultStatus').textContent=`${activeTab==='cash'?'現金回饋':'哩程回饋'} · ${activeScenario} · 顯示 ${shown} 張。回饋須符合條件；待查證項目請先確認官方公告。`;
}

scenarios.forEach(s=>{

// 哩程 tab 專用比較列：常態最優累哩（元/哩，低者優）＋年費，取代情境篩選
function renderMileStrip(){
  const box=document.getElementById('mileStrip');
  if(activeTab!=='mile'){box.classList.add('hide');box.innerHTML='';return;}
  const rows=cards.filter(c=>isMileCard(c)&&visibleCards.has(c.id))
    .map(c=>({id:c.id,n:c.name,v:bestOffer(c,'哩程')?.value,fee:c.fee}))
    .filter(c=>Number.isFinite(c.v))
    .sort((a,b)=>a.v-b.v);
  box.classList.remove('hide');
  box.innerHTML=`<span class="ms-label">常態最優累哩比較 · 元/哩越低越好</span>`+
    rows.map((r,i)=>`<a class="reco-pill" href="#card-${r.id}" onclick="focusCard('${r.id}')"><span class="reco-medal">${i+1}</span>${r.n}<b>NT$${r.v}/哩</b>${r.fee?`<span class="reco-cap">${r.fee}</span>`:''}</a>`).join('');
}

  '臺灣實體直接刷卡':['physical','direct'],
  '日本實體（日圓）':['physical','direct'],
  '日本指定實體門市':['physical','direct']
};
function searchChannelMatches(allowed,chosen){return (allowed||[]).some(c=>c===chosen||(DIRECT_CHANNEL_PARENTS[chosen]||[]).includes(c));}
function merchantDirectory(){
  const entries=new Map();
  const add=(n,aliases=[])=>{if(!entries.has(n))entries.set(n,new Set([n,...(MERCHANT_ALIASES[n]||[])]));aliases.forEach(a=>entries.get(n).add(a));};
  cards.forEach(c=>cardOffers(c).forEach(o=>searchGroups(o.t).forEach(r=>(r.merchants||[]).forEach(n=>add(n,[...(searchRule(o.t).aliases?.[n]||[]),...(r.aliases?.[n]||[])])))));
  return entries;
}
function merchantMatches(query){
  const q=merchantNorm(query);if(!q)return {name:null,suggestions:[]};
  const entries=[...merchantDirectory()];
  const exact=entries.filter(([n,a])=>[...a].some(x=>merchantNorm(x)===q));
  const canonical=exact.find(([n])=>merchantNorm(n)===q);
  if(canonical)return {name:canonical[0],suggestions:[]};
  if(exact.length===1)return {name:exact[0][0],suggestions:[]};
  const partial=exact.length?exact:entries.filter(([n,a])=>[...a].some(x=>merchantNorm(x).includes(q)));
  return {name:null,suggestions:partial.map(([n])=>n).sort((a,b)=>a.localeCompare(b,'zh-Hant')).slice(0,12)};
}
function merchantName(query){
  return merchantMatches(query).name;
}
function escapeText(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function defaultMerchantChannel(query){return merchantName(query)==='日本實體一般消費'?'physical':'direct';}
function merchantResults(query,channel=defaultMerchantChannel(query)){
  const {name,suggestions}=merchantMatches(query),ranked=[],perks=[],uncertain=[],channels=new Set(['direct']);
  if(!name)return {name,ranked,perks,uncertain,suggestions,channels:[...channels]};
  const mile=activeTab==='mile';
  for(const c of tabCards().filter(c=>visibleCards.has(c.id))){
    const candidates=[];
    for(const o of cardOffers(c)){
      const t=o.t;
      if(!offerActive(t)||!offerAllowed(t))continue;
      for(const rule of searchGroups(t)){
      if(!rule.merchants?.includes(name))continue;
      const valid=rule.status==='verified'&&rule.checkedAt&&rule.source?.startsWith('https:')&&rule.end&&!expired(rule.end)&&!t.suspendRanking;
      if(!valid){uncertain.push({c,t,reason:rule.reason||'適用性尚未確認'});continue;}
      (rule.channels||[]).forEach(x=>channels.add(x));
      const channelOK=searchChannelMatches(rule.channels,channel);
      if(!channelOK)continue;
      const hasCurrency=t.merchantForeignRate!=null;
      const qualifier=rule.qualifier||'';
      if(rule.searchType==='perk'){perks.push({c,t,s:o.s,key:o.key,value:null,qualifier});continue;}
      if(rule.searchType!==(mile?'mile':'cash'))continue;
      if(!(mile?/^\d+(\.\d+)?元\/哩$/:/^\d+(\.\d+)?$/).test(t.rate))continue;
      const scenario=rule.queryScenarios?.[name];
      const rate=scenario?t.scenarioRates?.[scenario]:parseFloat(t.rate);
      const value=hasCurrency&&!scenario?Math.min(rate,t.merchantForeignRate):rate;
      if(!Number.isFinite(value)||value<=0)continue;
      candidates.push({c,t,s:o.s,key:o.key,value,qualifier});
      }
    }
    candidates.sort((a,b)=>(mile?a.value-b.value:b.value-a.value)||compareCaps({cap:a.t.capSpend,period:a.t.capPeriod},{cap:b.t.capSpend,period:b.t.capPeriod}));
    if(candidates.length)ranked.push(candidates[0]);
  }
  ranked.sort((a,b)=>(mile?a.value-b.value:b.value-a.value)||compareCaps({cap:a.t.capSpend,period:a.t.capPeriod},{cap:b.t.capSpend,period:b.t.capPeriod})||a.c.name.localeCompare(b.c.name,'zh-Hant'));
  return {name,ranked,perks,uncertain,suggestions,channels:[...channels]};
}
function setMerchantQuery(value){
  const next=String(value).slice(0,80);
  // A blur/change event with unchanged text must not replace a button between pointerdown and click.
  if(next===merchantQuery)return;
  merchantChannel=defaultMerchantChannel(next);merchantQuery=next;renderMerchantSearch();
}
function chooseMerchant(index){const n=merchantMatches(merchantQuery).suggestions[index];if(n){document.getElementById('merchantQuery').value=n;setMerchantQuery(n);}}
function chooseMerchantChannel(index){const channel=merchantResults(merchantQuery).channels[index];if(channel){merchantChannel=channel;renderMerchantSearch();}}
function clearMerchantSearch(){merchantQuery='';merchantChannel='direct';document.getElementById('merchantQuery').value='';renderMerchantSearch();document.getElementById('merchantQuery').focus();}
function showMerchantCard(id){
  activeScenario='全部';
  document.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('active',x.textContent==='全部');x.setAttribute('aria-pressed',String(x.textContent==='全部'));});
  renderReco();renderGrid();
  const card=document.getElementById('card-'+id);
  document.querySelectorAll('#card-'+id+' details').forEach(d=>{d.open=true;});
  card?.scrollIntoView({block:'start'});focusCard(id);
}
function renderMerchantSearch(){
  const box=document.getElementById('merchantResults'),status=document.getElementById('merchantStatus');
  const channelBox=document.getElementById('merchantChannels');channelBox.innerHTML='';
  if(!merchantQuery.trim()){box.innerHTML='';status.textContent='輸入商家或消費項目查看推薦。';return;}
  let result=merchantResults(merchantQuery,merchantChannel);
  // Selection/tab/filter changes can remove the previously chosen channel.
  if(!result.channels.includes(merchantChannel)){
    merchantChannel='direct';result=merchantResults(merchantQuery,merchantChannel);
  }
  if(!result.name){
    status.textContent=result.suggestions.length?'請選擇確切商家或消費項目：':'尚未收錄這個商家；沒有結果不代表沒有回饋。';
    box.innerHTML=result.suggestions.map((n,i)=>'<button type="button" onclick="chooseMerchant('+i+')">'+escapeText(n)+'</button>').join(' ');return;
  }
  const channelLabel={direct:'一般直接刷卡',online:'線上直接刷卡',physical:'實體直接刷卡'};
  if(result.channels.length>1)channelBox.innerHTML=result.channels.map((v,i)=>'<button type="button" aria-pressed="'+String(v===merchantChannel)+'" onclick="chooseMerchantChannel('+i+')">'+escapeText(channelLabel[v]||v)+'</button>').join('');
  const mile=activeTab==='mile';
  status.textContent=result.name+'：'+result.ranked.length+'張回饋符合'+(result.perks.length?'，另有'+result.perks.length+'項權益':'')+'。'+(mile?'元／哩越低越優先。':'依回饋率排序（雙幣別採較低比例）。');
  box.innerHTML='<ol class="merchant-list">'+result.ranked.map((r,i)=>{
    const t=r.t;
    const rateLabel=mile?r.value+'元/哩':t.merchantForeignRate!=null?'新臺幣 '+t.rate+'%／外幣 '+t.merchantForeignRate+'%':r.value+'%';
    return '<li class="merchant-item"><h3>'+escapeText((i+1)+'. '+r.c.name)+' <strong>'+escapeText(rateLabel)+'</strong></h3>'+
      '<div>上限：'+escapeText(t.cap||'待確認')+'</div>'+
      '<div>'+escapeText(r.s||t.label)+'</div>'+
      (r.qualifier?'<div>'+escapeText(r.qualifier)+'</div>':'')+
      '<button type="button" onclick="showMerchantCard(\''+r.c.id+'\')">'+escapeText(r.s?r.s+'・查看條件':'查看適用條件')+'</button></li>';
  }).join('')+'</ol>'+
  (result.perks.length?'<h3>適用權益（不列回饋率排名）</h3><ul class="merchant-list">'+result.perks.map(r=>'<li class="merchant-item"><h3>'+escapeText(r.c.name)+' '+escapeText(r.t.rate)+'</h3><div>'+escapeText(r.t.label)+'</div>'+(r.qualifier?'<div>'+escapeText(r.qualifier)+'</div>':'')+'<div>上限：'+escapeText(r.t.cap||'待確認')+'</div><button type="button" onclick="showMerchantCard(\''+r.c.id+'\')">查看適用條件</button></li>').join('')+'</ul>':'')+
  (!result.ranked.length&&!result.perks.length?'<p>'+(result.channels.length>1?'請選擇符合實際交易的方式。':'沒有已確認符合的卡片，請檢查選卡、分頁或優惠篩選。')+'</p>':'');
}
function toggleReco(){recoExpanded=!recoExpanded;renderReco();document.querySelector('.reco-more')?.focus();}
function renderReco(){
  renderMerchantSearch();
  const box = document.getElementById('reco');
  if(activeScenario==="全部"){ box.style.display='none'; box.innerHTML=''; return; }
  const ranked = tabCards()
    .filter(c=>visibleCards.has(c.id) && rateActive(c,activeScenario) && c.tags.includes(activeScenario))
    .sort((a,b)=> bestOffer(b,activeScenario).value-bestOffer(a,activeScenario).value || compareCards(a,b,activeScenario));
  if(!ranked.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  const pill=(c,i)=>{
    const offer=bestOffer(c,activeScenario);
    const meta=[offer.condition||offer.label,offer.kind==='limited'?'限時優惠':'',!offer.checkedAt?'尚待核實':''].filter(Boolean).join(' · ');
    const cap=offer.capSpend;
    const period=offer.capPeriod;
    const periodLabel=PERIOD_LABEL[period] || '週期待確認';
    return`<a class="reco-pill" href="#card-${c.id}" onclick="focusCard('${c.id}')"><span class="reco-medal">${i+1}</span>${c.name}<b>${offer.value}%</b>${cap!=null?`<span class="reco-cap">可刷約${cap.toLocaleString()}（${periodLabel}）</span>`:`<span class="reco-cap">${offer.cap||'上限待確認'}</span>`}${meta?`<span class="reco-meta">${meta}</span>`:''}</a>`;
  };
  const show = recoExpanded ? ranked : ranked.slice(0,3);
  box.innerHTML = `<span class="reco-label">${activeScenario} · 符合條件時最高回饋</span>` +
    show.map(pill).join('') +
    (ranked.length>3?`<button type="button" class="reco-pill reco-more" aria-expanded="${recoExpanded}" onclick="toggleReco()">${recoExpanded?'收合 ▴':`+${ranked.length-3} 更多 ▾`}</button>`:'');
}

renderSelector();
renderReco();
renderGrid();
renderMileStrip();

// 瀏覽統計：Abacus（免註冊、免API key）。原用的 CounterAPI v1 已於 2026/07 停用（410），故遷移。
// /hit/ 會遞增並回傳 {"value":N}；日計數以台灣時間(UTC+8)換日，避免 UTC 造成早上8點才跨日。
(function(){
  const NS = "nctuwanglin-ccg";
  const base = `https://abacus.jasoncameron.dev/hit/${NS}`;
  const today = new Date(Date.now()+8*3600*1000).toISOString().slice(0,10).replace(/-/g,"");
  const el = document.getElementById('visits');
  const num = v => (v && typeof v.value === 'number') ? v.value.toLocaleString('en-US') : null;
  Promise.allSettled([
    fetch(`${base}/total`).then(r=>r.json()),
    fetch(`${base}/day-${today}`).then(r=>r.json()),
  ]).then(([total,day])=>{
    const t = total.status==='fulfilled' ? num(total.value) : null;
    const d = day.status==='fulfilled' ? num(day.value) : null;
    const parts = [];
    if(d) parts.push(`<span>今日瀏覽 <b>${d}</b></span>`);
    if(t) parts.push(`<span>累計瀏覽 <b>${t}</b></span>`);
    el.innerHTML = parts.join('');
  }).catch(()=>{ el.textContent = ""; });
})();
</script>
